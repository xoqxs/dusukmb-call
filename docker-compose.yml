# Tek sunucuda her şey: uygulama + HTTPS (Caddy) + TURN (coturn)
# Kullanım: .env dosyasını doldur, sonra:  docker compose up -d --build
services:
  app:
    build: .
    restart: unless-stopped
    environment:
      - TURN_SECRET=${TURN_SECRET}
      - TURN_HOST=${PUBLIC_IP}
    expose:
      - "3000"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      - DOMAIN=${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on:
      - app

  coturn:
    image: coturn/coturn:latest
    restart: unless-stopped
    network_mode: host
    command:
      - -n
      - --log-file=stdout
      - --listening-port=3478
      - --fingerprint
      - --use-auth-secret
      - --static-auth-secret=${TURN_SECRET}
      - --realm=${DOMAIN}
      - --external-ip=${PUBLIC_IP}/${PRIVATE_IP}
      - --min-port=49160
      - --max-port=49200
      - --no-cli
      - --no-tls
      - --no-dtls
      - --no-multicast-peers
      - --denied-peer-ip=10.0.0.0-10.255.255.255
      - --denied-peer-ip=172.16.0.0-172.31.255.255
      - --denied-peer-ip=192.168.0.0-192.168.255.255
      - --total-quota=100

volumes:
  caddy_data:
